name: Continuous Integration with Gradle

permissions:
  contents: write # to upload release assets
  packages: write # to publish packages

on:
  push:
    branches:
      - '*'         # matches every branch that doesn't contain a '/'
      - '*/*'       # matches every branch containing a single '/'
      - '**'        # matches every branch
    paths-ignore:
      - README.md
      - README.es.md
      - docker/*

  pull_request:
    branches:
      - main
      - master
      - develop
      - experimental
      - test/**
      - bugfix/**
      - feature/**
      - hotfix/**
      - test/**
    paths-ignore:
      - README.md
      - README.es.md
      - docker/*

jobs:

  build-ci:
    name: Build ADempiere Processors Service
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-package: 'jdk'
          java-version: 17
          architecture: x64

      - name: Setup Gradle 9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.0.0 # current

      - name: Run Create Release
        run: gradle createRelease --warning-mode all --stacktrace
        env:
          GITHUB_DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GITHUB_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Upload descriptor file artifact
        uses: actions/upload-artifact@v4
        with:
          name: adempiere-processors-service.dsc
          path: build/descriptors/adempiere-processors-service.dsc
          retention-days: 1

      - name: Upload dist app zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: adempiere-processors-service.zip
          path: build/release/adempiere-processors-service.zip
          retention-days: 1

  # Check secrets to push image in docker hub registry
  check-docker-secrets:
    name: Check if the registry information was set on secrets and variables
    needs:
      - build-ci
    runs-on: ubuntu-latest
    outputs:
      is_have_secrets: ${{ steps.check_docker_hub_secrets_job.outputs.is_have_secrets }}
    steps:
      - id: check_docker_hub_secrets_job
        run: |
          if [[ "${{ vars.DOCKER_REGISTRY }}" != "" && \
                "${{ vars.DOCKER_REPO }}" != "" && \
                "${{ secrets.DOCKER_USERNAME }}" != "" && \
                "${{ secrets.DOCKER_TOKEN }}" != "" ]]; \
          then
            echo "Secrets to use a container registry are configured in the repo"
            echo "is_have_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "Secrets to use a container registry were not configured in the repo"
            echo "is_have_secrets=false" >> $GITHUB_OUTPUT
          fi

  # Extract branch name for tagging
  extract-branch:
    name: Extract branch name
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.extract_branch.outputs.branch }}
    steps:
      - id: extract_branch
        run: |
          if [[ "${{ github.head_ref }}" != "" ]]; then
            # For pull requests
            branch="${{ github.head_ref }}"
          else
            # For pushes
            branch="${{ github.ref_name }}"
          fi
          # Replace special characters with dashes for valid Docker tags
          branch=$(echo "$branch" | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "branch=$branch" >> $GITHUB_OUTPUT
          echo "Branch tag will be: $branch"

  # Publish docker alpine image in Docker Hub Registry to application
  push-alpine-image-ci:
    name: Push docker alpine image to Docker Hub (CI)
    needs:
      - check-docker-secrets
      - extract-branch
    # Skip step based on secret
    if: needs.check-docker-secrets.outputs.is_have_secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Download build dist app
        uses: actions/download-artifact@v4
        with:
          name: adempiere-processors-service.zip

      - name: Unzip Asset
        run: |
          unzip adempiere-processors-service.zip -d docker/

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push alpine image in Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alpine.Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKER_REGISTRY }}/${{ vars.DOCKER_REPO }}:${{ needs.extract-branch.outputs.branch }}-alpine

  # Publish docker multiplatform image in Docker Hub Registry to application
  push-image-ci:
    name: Push docker multiplatform image to Docker Hub (CI)
    needs:
      - check-docker-secrets
      - extract-branch
    # Skip step based on secret
    if: needs.check-docker-secrets.outputs.is_have_secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Download build dist app
        uses: actions/download-artifact@v4
        with:
          name: adempiere-processors-service.zip

      - name: Unzip Asset
        run: |
          unzip adempiere-processors-service.zip -d docker/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push ubuntu image in Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ubuntu.Dockerfile
          platforms: linux/amd64,linux/amd64/v2
          push: true
          tags: |
            ${{ vars.DOCKER_REGISTRY }}/${{ vars.DOCKER_REPO }}:${{ needs.extract-branch.outputs.branch }}
